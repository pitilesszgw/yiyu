<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="以渔数媒广告账户管理服务，为出海团队提供账户、资金与投放协同支持。">
    <title>广告账户的管家婆 | 以渔数媒</title>
    <link rel="icon" href="../static/favicon.ico" sizes="any">
    <style>
        :root {
            --purple: #6424e8;
            --purple-dark: #4d16c7;
            --purple-soft: #f1eaff;
            --ink: #201733;
            --muted: #766f84;
            --line: #ebe8f1;
            --field: #f8f7fb;
            --green: #1da47b;
            --page: #f4f2f8;
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            background: var(--page);
            color: var(--ink);
            font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        button, input, textarea { font: inherit; }
        button, a { -webkit-tap-highlight-color: transparent; }
        a { color: inherit; }

        .page-shell {
            width: min(720px, calc(100% - 32px));
            margin: 28px auto 104px;
            overflow: hidden;
            background: #fff;
            border-radius: 32px;
            box-shadow: 0 24px 80px rgba(39, 25, 71, 0.08);
        }

        .top-section { padding: 28px 40px 16px; }
        .nav { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
        .brand { display: inline-flex; align-items: center; text-decoration: none; }
        .brand img { display: block; width: 156px; height: auto; }
        .nav-link { color: var(--muted); font-size: 13px; text-decoration: none; transition: color 180ms ease; }
        .nav-link:hover, .nav-link:focus-visible { color: var(--purple); }
        :focus-visible { outline: 3px solid rgba(100, 36, 232, 0.24); outline-offset: 3px; }

        .hero { padding: 74px 0 32px; }
        .eyebrow {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 0 24px;
            color: var(--purple);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.16em;
        }

        .eyebrow::before { width: 7px; height: 7px; background: var(--purple); border-radius: 50%; content: ""; }
        h1 {
            max-width: 520px;
            margin: 0;
            font-size: clamp(46px, 8vw, 68px);
            font-weight: 760;
            letter-spacing: -0.07em;
            line-height: 1.08;
        }

        h1 span { display: block; margin-top: 8px; color: var(--purple); }
        .hero-lead { margin: 28px 0 0; font-size: 18px; font-weight: 700; }
        .hero-note { margin: 14px 0 0; color: #9a94a5; font-size: 13px; }

        .film-card { overflow: hidden; margin-top: 42px; border: 1px solid #e9e3f4; border-radius: 24px; background: #fff; }
        .film-visual { overflow: hidden; aspect-ratio: 16 / 9; background: #0d0b11; }
        .product-video { display: block; width: 100%; height: 100%; object-fit: contain; background: #0d0b11; }
        .film-caption { display: flex; align-items: center; justify-content: flex-end; gap: 20px; min-height: 60px; padding: 0 22px; color: var(--muted); font-size: 12px; }

        .quick-contact {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-top: 22px;
            padding: 19px 22px;
            border-radius: 18px;
            background: #f7f5fa;
            text-decoration: none;
            transition: background 180ms ease, transform 180ms ease;
        }

        .quick-contact:hover { background: #f1edf7; transform: translateY(-2px); }
        .chat-icon, .arrow-icon { flex: 0 0 auto; display: grid; place-items: center; border-radius: 50%; }
        .chat-icon { width: 40px; height: 40px; background: #dff7ee; color: var(--green); }
        .arrow-icon { width: 36px; height: 36px; margin-left: auto; background: #fff; color: var(--green); }
        .contact-copy { display: grid; gap: 4px; }
        .contact-copy strong { font-size: 16px; }
        .contact-copy span { color: #938c9c; font-size: 12px; }

        .form-section { border-top: 1px solid var(--line); padding: 38px 40px 36px; }
        .section-meta { display: flex; justify-content: space-between; color: var(--purple); font-size: 11px; font-weight: 800; letter-spacing: 0.14em; }
        .section-meta span:last-child { color: #aaa4b2; font-weight: 600; letter-spacing: 0.08em; }
        h2 { margin: 16px 0 0; font-size: 30px; letter-spacing: -0.04em; }
        .form-intro { margin: 10px 0 30px; color: #8c8595; font-size: 13px; }
        .lead-form { display: grid; gap: 22px; }
        .field-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
        .field { display: grid; gap: 9px; }
        .field label, fieldset legend { font-size: 13px; font-weight: 750; }
        .required { color: var(--purple); }
        .optional { margin-left: 7px; color: #aaa4b2; font-size: 11px; font-weight: 500; }

        input, textarea {
            width: 100%;
            border: 1px solid transparent;
            border-radius: 12px;
            background: var(--field);
            color: var(--ink);
            transition: border-color 180ms ease, background 180ms ease, box-shadow 180ms ease;
        }

        input { height: 54px; padding: 0 16px; }
        textarea { min-height: 104px; padding: 15px 16px; resize: vertical; }
        input::placeholder, textarea::placeholder { color: #b1abb9; }
        input:hover, textarea:hover { background: #f4f1fa; }
        input:focus, textarea:focus { outline: 0; border-color: #a879f5; background: #fff; box-shadow: 0 0 0 4px rgba(100, 36, 232, 0.1); }
        input:user-invalid, textarea:user-invalid { border-color: #d43b60; }

        fieldset { min-width: 0; margin: 0; padding: 0; border: 0; }
        .interest-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
        .interest-option { position: relative; }
        .interest-option input { position: absolute; width: 1px; height: 1px; opacity: 0; }
        .interest-option label {
            min-height: 48px;
            display: grid;
            place-items: center;
            padding: 8px;
            border: 1px solid var(--line);
            border-radius: 11px;
            color: #777080;
            background: #fff;
            cursor: pointer;
            text-align: center;
            transition: border-color 180ms ease, color 180ms ease, background 180ms ease;
        }

        .interest-option input:checked + label { border-color: var(--purple); color: var(--purple); background: var(--purple-soft); box-shadow: inset -14px -14px 0 -10px var(--purple); }
        .interest-option input:focus-visible + label { outline: 3px solid rgba(100, 36, 232, 0.24); outline-offset: 3px; }
        .consent { display: flex; align-items: flex-start; gap: 10px; color: #85808e; font-size: 12px; line-height: 1.6; }
        .consent input { flex: 0 0 auto; width: 16px; height: 16px; margin: 1px 0 0; accent-color: var(--purple); }
        .consent a { color: var(--purple); }

        .submit-button {
            min-height: 58px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 0 22px;
            border: 0;
            border-radius: 13px;
            background: linear-gradient(100deg, #6a20ec, #4d18da);
            color: #fff;
            font-weight: 800;
            box-shadow: 0 12px 28px rgba(93, 31, 222, 0.22);
            cursor: pointer;
            transition: transform 180ms ease, box-shadow 180ms ease, opacity 180ms ease;
        }

        .submit-button:hover { transform: translateY(-2px); box-shadow: 0 16px 34px rgba(93, 31, 222, 0.28); }
        .submit-button:disabled { opacity: 0.65; cursor: wait; transform: none; box-shadow: none; }
        .form-status { min-height: 20px; margin: -8px 0 0; color: var(--green); font-size: 12px; text-align: center; }
        .lead-fallback { min-height: 44px; margin: -8px auto 0; padding: 8px 16px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--purple); font-size: 13px; cursor: pointer; }
        .lead-fallback:hover { background: var(--purple-soft); }
        .privacy-note { display: flex; justify-content: center; align-items: center; gap: 7px; margin-top: -10px; color: #aaa4b2; font-size: 11px; }
        .footer { padding: 34px 40px 70px; border-top: 1px solid var(--line); text-align: center; }
        .footer .brand { justify-content: center; }
        .footer p { margin: 16px 0 0; color: #aaa4b2; font-size: 11px; letter-spacing: 0.08em; }

        .bottom-bar {
            position: fixed;
            z-index: 10;
            right: 0;
            bottom: 0;
            left: 0;
            display: flex;
            justify-content: center;
            padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
            border-top: 1px solid rgba(37, 24, 62, 0.08);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(14px);
        }

        .bottom-inner { width: min(680px, 100%); display: grid; grid-template-columns: 150px 1fr; align-items: center; gap: 12px; }
        .bottom-contact { min-height: 44px; display: flex; align-items: center; gap: 8px; padding: 0; border: 0; background: transparent; color: #665f71; font-size: 13px; text-decoration: none; cursor: pointer; transition: color 180ms ease; }
        .bottom-contact:hover { color: var(--purple); }
        .bottom-cta { min-height: 50px; display: flex; align-items: center; justify-content: center; gap: 16px; border-radius: 11px; background: var(--purple); color: #fff; font-size: 14px; font-weight: 800; text-decoration: none; }

        .qr-dialog {
            width: min(380px, calc(100% - 32px));
            max-height: calc(100vh - 32px);
            margin: auto;
            padding: 0;
            border: 0;
            border-radius: 24px;
            background: #fff;
            color: var(--ink);
            box-shadow: 0 28px 90px rgba(27, 17, 48, 0.3);
            overflow: auto;
        }

        .qr-dialog::backdrop { background: rgba(24, 17, 38, 0.58); backdrop-filter: blur(5px); }
        .qr-dialog-inner { position: relative; display: grid; justify-items: center; gap: 8px; padding: 24px; text-align: center; }
        .qr-dialog h2 { margin: 0; font-size: 22px; letter-spacing: -0.03em; }
        .qr-dialog p { margin: 0 0 8px; color: var(--muted); font-size: 13px; }
        .qr-dialog img { display: block; width: min(300px, 100%); height: auto; max-height: min(68vh, 520px); object-fit: contain; }
        .qr-dialog-close {
            position: absolute;
            z-index: 1;
            top: 14px;
            right: 14px;
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: #f2eff7;
            color: #625b6c;
            font-size: 24px;
            line-height: 1;
            cursor: pointer;
            transition: background 180ms ease, color 180ms ease;
        }

        .qr-dialog-close:hover { background: var(--purple-soft); color: var(--purple); }

        @media (max-width: 720px) {
            .page-shell { width: 100%; margin: 0 0 92px; border-radius: 0; box-shadow: none; }
            .top-section, .form-section { padding-right: 22px; padding-left: 22px; }
            .top-section { padding-top: 22px; }
            .brand img { width: 132px; }
            .hero { padding-top: 58px; }
            h1 { font-size: clamp(44px, 14vw, 60px); }
            .hero-lead { font-size: 16px; }
            .film-caption { align-items: flex-start; padding: 15px 18px; }
            .film-caption span { max-width: 48%; text-align: right; }
            .form-section { padding-top: 34px; }
            .field-row { grid-template-columns: 1fr; }
            .interest-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .footer { padding-right: 22px; padding-left: 22px; }
            .bottom-inner { grid-template-columns: 98px 1fr; }
            .bottom-bar { padding-right: 12px; padding-left: 12px; }
            .qr-dialog-inner { padding: 22px 18px 18px; }
            .qr-dialog img { max-height: 64vh; }
        }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            *, *::before, *::after { transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <main class="page-shell">
        <section class="top-section">
            <nav class="nav" aria-label="主导航">
                <a class="brand" href="/" aria-label="返回以渔数媒首页">
                    <img src="../static/images/yiyu-logo-purple.png" alt="以渔数媒 EyuAgency">
                </a>
                <a class="nav-link" href="#contact">联系我们&nbsp; ↗</a>
            </nav>

            <div class="hero">
                <p class="eyebrow">EYU AGENCY</p>
                <h1>广告账户的<span>管家婆</span></h1>
                <p class="hero-lead">官方 API 打通，二不限 / 三不限一手抓</p>
                <p class="hero-note">全自动接口，更高效率出海</p>
            </div>

            <article class="film-card" aria-label="以渔介绍视频">
                <div class="film-visual">
                    <video class="product-video" controls playsinline preload="metadata" poster="../static/images/yiyu-exhibition-poster-end.jpg" aria-label="以渔展会介绍视频">
                        <source src="../static/videos/yiyu-exhibition.mp4" type="video/mp4">
                        您的浏览器暂不支持视频播放。
                    </video>
                </div>
                <div class="film-caption">
                    <span>了解以渔，从这里开始&nbsp; ↗</span>
                </div>
            </article>

            <a class="quick-contact" href="#contact">
                <span class="chat-icon" aria-hidden="true">
                    <svg width="23" height="23" viewBox="0 0 24 24" fill="none"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.5 9.7 9.7 0 0 1-3.8-.8L3 21l1.7-4.4A8.1 8.1 0 0 1 3.5 12a8.4 8.4 0 0 1 9-8.5A8.4 8.4 0 0 1 21 11.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
                </span>
                <span class="contact-copy"><strong>聊一聊您的需求</strong><span>提交信息，直接沟通产品细节</span></span>
                <span class="arrow-icon" aria-hidden="true">↗</span>
            </a>
        </section>

        <section class="form-section" id="contact">
            <div class="section-meta"><span>LET'S TALK</span><span>01 / 留下需求</span></div>
            <h2>好方案，从了解您开始。</h2>
            <p class="form-intro">填写以下信息，方便我们为您提供针对性的沟通。</p>

            <form class="lead-form" id="leadForm" action="/api/lead" method="post" novalidate>
                <div class="field-row">
                    <div class="field">
                        <label for="name">您的称呼 <span class="required">*</span></label>
                        <input id="name" name="entry.659206793" autocomplete="name" placeholder="请输入您的姓名" maxlength="100" required>
                    </div>
                    <div class="field">
                        <label for="phone">手机号码 <span class="required">*</span></label>
                        <input id="phone" name="entry.649232157" type="tel" inputmode="tel" autocomplete="tel" placeholder="请输入手机号码" minlength="6" maxlength="32" required>
                    </div>
                </div>

                <div class="field">
                    <label for="company">公司 / 品牌名称 <span class="optional">选填</span></label>
                    <input id="company" name="entry.1259853372" autocomplete="organization" placeholder="请输入公司或品牌名称" maxlength="200">
                </div>

                <fieldset>
                    <legend>您想了解什么？ <span class="required">*</span></legend>
                    <div class="interest-grid">
                        <div class="interest-option"><input id="interest-product" type="radio" name="entry.1105577049" value="了解产品" checked required><label for="interest-product">了解产品</label></div>
                        <div class="interest-option"><input id="interest-demo" type="radio" name="entry.1105577049" value="预约演示"><label for="interest-demo">预约演示</label></div>
                        <div class="interest-option"><input id="interest-price" type="radio" name="entry.1105577049" value="获取报价"><label for="interest-price">获取报价</label></div>
                        <div class="interest-option"><input id="interest-coop" type="radio" name="entry.1105577049" value="合作咨询"><label for="interest-coop">合作咨询</label></div>
                    </div>
                </fieldset>

                <div class="field">
                    <label for="details">补充说明 <span class="optional">选填</span></label>
                    <textarea id="details" name="entry.853679754" placeholder="例如：感兴趣的功能、使用场景或其他需求…" maxlength="2000"></textarea>
                </div>

                <label class="consent">
                    <input name="consent" type="checkbox" required>
                    <span>我同意将所填信息用于本次产品咨询与后续联系。</span>
                </label>

                <button class="submit-button" type="submit"><span>提交需求，开启沟通</span><span aria-hidden="true">→</span></button>
                <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
                <button class="lead-fallback" id="leadWechatFallback" type="button" aria-haspopup="dialog" aria-controls="wechatDialog" hidden>改用微信咨询 ↗</button>
                <p class="privacy-note">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z" stroke="currentColor" stroke-width="2"/><path d="m9 12 2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    您的信息仅用于产品咨询沟通
                </p>
            </form>
        </section>

        <footer class="footer">
            <a class="brand" href="/" aria-label="返回以渔数媒首页">
                <img src="../static/images/yiyu-logo-purple.png" alt="以渔数媒 EyuAgency">
            </a>
            <p>一站了解 · 通力合作</p>
            <p>EYU AGENCY © 2026</p>
        </footer>
    </main>

    <div class="bottom-bar">
        <div class="bottom-inner">
            <button class="bottom-contact" id="wechatContactButton" type="button" aria-haspopup="dialog" aria-controls="wechatDialog">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.5 9.7 9.7 0 0 1-3.8-.8L3 21l1.7-4.4A8.1 8.1 0 0 1 3.5 12a8.4 8.4 0 0 1 9-8.5A8.4 8.4 0 0 1 21 11.5Z" stroke="currentColor" stroke-width="2"/></svg>
                联系咨询
            </button>
            <a class="bottom-cta" href="#contact">获取产品方案 <span aria-hidden="true">↗</span></a>
        </div>
    </div>

    <dialog class="qr-dialog" id="wechatDialog" aria-labelledby="wechatDialogTitle">
        <div class="qr-dialog-inner">
            <button class="qr-dialog-close" type="button" aria-label="关闭微信二维码">×</button>
            <h2 id="wechatDialogTitle">微信咨询</h2>
            <p>打开微信扫一扫，添加好友后即可沟通。</p>
            <img src="../static/images/wechat-contact-qr.png" alt="联系咨询微信二维码">
        </div>
    </dialog>

    <script>
        const form = document.querySelector('#leadForm');
        const status = document.querySelector('#formStatus');
        const submitButton = form.querySelector('.submit-button');
        const submitLabel = submitButton.querySelector('span');
        const leadWechatFallback = document.querySelector('#leadWechatFallback');
        const wechatContactButton = document.querySelector('#wechatContactButton');
        const wechatDialog = document.querySelector('#wechatDialog');
        const wechatDialogClose = wechatDialog.querySelector('.qr-dialog-close');
        let dialogTrigger = wechatContactButton;

        [wechatContactButton, leadWechatFallback].forEach((button) => {
            button.addEventListener('click', () => {
                dialogTrigger = button;
                wechatDialog.showModal();
            });
        });
        wechatDialogClose.addEventListener('click', () => wechatDialog.close());
        wechatDialog.addEventListener('click', (event) => {
            const bounds = wechatDialog.getBoundingClientRect();
            const insideDialog = event.clientX >= bounds.left && event.clientX <= bounds.right && event.clientY >= bounds.top && event.clientY <= bounds.bottom;
            if (!insideDialog) wechatDialog.close();
        });
        wechatDialog.addEventListener('close', () => dialogTrigger.focus());

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            if (submitButton.disabled) return;
            if (!form.checkValidity()) {
                form.reportValidity();
                status.textContent = '请先补全必填信息。';
                status.style.color = '#d43b60';
                return;
            }

            submitButton.disabled = true;
            form.setAttribute('aria-busy', 'true');
            leadWechatFallback.hidden = true;
            submitLabel.textContent = '正在提交…';
            status.textContent = '正在安全提交您的需求，请稍候。';
            status.style.color = '';
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 8000);
            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: new URLSearchParams(new FormData(form)),
                    signal: controller.signal,
                });
                const result = await response.json();
                if (!response.ok || result.ok !== true) {
                    throw new Error(result.message || '暂未确认提交结果，请勿重复提交，建议通过微信联系我们。');
                }
                form.reset();
                status.textContent = '提交成功，我们会尽快与您联系。';
            } catch (error) {
                status.textContent = error.name === 'AbortError' || error instanceof TypeError || error instanceof SyntaxError
                    ? '暂未确认提交结果，请勿重复提交，建议通过微信联系我们。'
                    : error.message;
                status.style.color = '#d43b60';
                leadWechatFallback.hidden = false;
            } finally {
                clearTimeout(timer);
                submitButton.disabled = false;
                form.removeAttribute('aria-busy');
                submitLabel.textContent = '提交需求，开启沟通';
            }
        });
    </script>
</body>
</html>
